name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PIPELINE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m fintech_pipeline init-db
      - run: pytest -q
      - run: python -m fintech_pipeline bootstrap --start 2026-01-01 --end 2026-01-07
      - run: python -m fintech_pipeline run --date 2026-01-08
      - run: python -m fintech_pipeline run --date 2026-01-08

